<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 236" width="1200" height="236" role="img" aria-labelledby="banner-title banner-desc">
  <title id="banner-title">Ethan Olson</title>
  <desc id="banner-desc">Founder, NexSites. Dallas, Texas. I run self-hosted infrastructure and build AI agents that help operate it.</desc>
  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .over { font-size: 16px; font-weight: 600; letter-spacing: 0.22em; fill: #9198a1; }
    .name { font-size: 92px; font-weight: 700; letter-spacing: -0.025em; fill: #f0f6fc; }
    .deck { font-size: 28px; font-weight: 400; fill: #9198a1; }
    .rule { stroke: #d0603f; stroke-width: 4; stroke-dasharray: 1200; animation: draw 1.1s cubic-bezier(0.22, 0.61, 0.36, 1) 0.15s both; }
    .hair { stroke: #3d444d; stroke-width: 1.333; }
    @keyframes draw { from { stroke-dashoffset: 1200; } to { stroke-dashoffset: 0; } }
    @media (prefers-reduced-motion: reduce) { .rule { animation: none; } }
  </style>
  <line class="rule" x1="0" y1="2" x2="1200" y2="2"/>
  <text class="sans over" x="0" y="50">FOUNDER &#183; NEXSITES.ORG</text>
  <text class="sans over" x="1194" y="50" text-anchor="end">DALLAS, TEXAS</text>
  <text class="sans name" x="-2" y="152">Ethan Olson</text>
  <text class="sans deck" x="0" y="203">I run self-hosted infrastructure and build AI agents that help operate it.</text>
  <line class="hair" x1="0" y1="234" x2="1200" y2="234"/>
</svg>
